# Written by siteseo: /siteseo markdown --setup --serve nginx
# Serves the .md file /siteseo markdown writes next to each page when a request
# sends Accept: text/markdown. Merge into your own config rather than replacing
# it: the two map blocks go in the http context, the rest in your server block.
# Tested against nginx 1.30 in Docker. Uses no `if`.

# --- http context ------------------------------------------------------------

# A prefix that never exists unless the client asked for Markdown.
map $http_accept $siteseo_md_prefix {
    default            "/.siteseo-no-markdown";
    "~*text/markdown"  "";
}

# /blog.html -> /blog, /about/index.html -> /about/index
map $uri $siteseo_md_base {
    "~^(?<base>.*)\.html$"  $base;
    default                 $uri;
}

# --- server block ------------------------------------------------------------

server {
    listen 80;
    server_name {{SITE_HOST}};
    root /usr/share/nginx/html;
    index index.html;

    # A types block replaces the inherited table, so include it again first.
    include /etc/nginx/mime.types;
    types { text/markdown md; }
    charset utf-8;
    charset_types text/markdown;

    location / {
        add_header Vary Accept always;
        try_files $siteseo_md_prefix$siteseo_md_base.md
                  $siteseo_md_prefix${siteseo_md_base}index.md
                  $siteseo_md_prefix$siteseo_md_base/index.md
                  $uri $uri.html $uri/ =404;
    }

    # A .md file requested directly points search engines at its HTML page.
    location ~ ^(?<siteseo_page>.*/)index\.md$ {
        add_header Link "<$scheme://$host$siteseo_page>; rel=\"canonical\"" always;
        try_files $uri =404;
    }
    location ~ ^(?<siteseo_page>.+)\.md$ {
        add_header Link "<$scheme://$host$siteseo_page>; rel=\"canonical\"" always;
        try_files $uri =404;
    }
}

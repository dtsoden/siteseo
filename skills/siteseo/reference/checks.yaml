# siteseo check catalog.
#
# Source of truth for every finding siteseo can emit. Code never invents an id:
# it calls findings.make() with an id declared here, and this file supplies a
# plain-English title, reason it matters and fix for the styled report, the
# module, severity, which score it counts against, the rule, a source backing
# the rule, the technical fix, and whether the fix can be applied automatically.
#
# score values:
#   search  counts against search health only
#   ai      counts against AI access only
#   both    counts against both
#   none    reported, never scored
#
# Adding a check here without a source URL is a validation error, on purpose.
last_verified: 2026-09-11

checks:

  # ---------------------------------------------------------------- module A
  - id: http.status_4xx
    title: Some links on your site lead to missing pages
    why: "Visitors who click these links hit a dead end, and search engines waste time on pages that aren't there."
    plain_fix: "Bring the missing page back, or change the links to point somewhere that exists. If the page moved, send its old address to the new one."
    module: A
    severity: error
    score: search
    rule: Internal URLs must not return a 4xx status.
    source: https://developers.google.com/crawling/docs/troubleshooting/http-status-codes
    fix: Restore the page or remove the links pointing at it. If it moved, add a 301 to the new URL.
    autofix: false

  - id: http.status_5xx
    title: Some pages fail with a server error
    why: "Visitors see an error instead of your page, and repeated errors make Google visit your whole site less often."
    plain_fix: "Ask whoever runs your hosting to find and fix the server error."
    module: A
    severity: error
    score: both
    rule: Internal URLs must not return a 5xx status.
    source: https://developers.google.com/crawling/docs/troubleshooting/http-status-codes
    fix: Fix the server error. Repeated 5xx responses slow crawling of the whole site.
    autofix: false

  - id: http.soft_404
    title: Missing pages tell Google they are fine
    why: "Google keeps empty \"not found\" pages in its index, where they can push out pages that matter."
    plain_fix: "Make missing pages tell browsers they're missing, instead of loading as normal pages that say \"not found\"."
    module: A
    severity: error
    score: search
    rule: A page whose content says not found must return 404 or 410, not 200.
    source: https://developers.google.com/crawling/docs/troubleshooting/http-status-codes
    fix: Return a real 404 status for missing content instead of a 200 with not-found text.
    autofix: false

  - id: http.404_returns_200
    title: Your not-found page tells Google it is a real page
    why: "Google treats every missing page as a real one, which fills its index with empty pages from your site."
    plain_fix: "Change a setting at your host so your not-found page tells browsers the page is missing."
    module: A
    severity: error
    score: search
    rule: The site's 404 page must return a 404 status code.
    source: https://developers.google.com/crawling/docs/troubleshooting/http-status-codes
    fix: Configure the host to serve the 404 template with a 404 status.
    autofix: false

  - id: redirect.chain
    title: Some redirects take several hops to arrive
    why: "Each extra hop slows visitors down, and search engines may give up before they reach the page."
    plain_fix: "Point the old address straight at the final page, skipping the stops in between."
    module: A
    severity: warning
    score: search
    rule: A redirect should reach its destination in one hop.
    source: https://developers.google.com/search/docs/crawling-indexing/301-redirects
    fix: Point the first redirect straight at the final URL.
    autofix: true

  - id: redirect.loop
    title: Some redirects go round in a circle and never arrive
    why: "The page never loads for anyone, visitors or search engines."
    plain_fix: "Change one of the redirects so the chain ends at a real page."
    module: A
    severity: error
    score: both
    rule: Redirects must not form a loop.
    source: https://developers.google.com/search/docs/crawling-indexing/301-redirects
    fix: Break the cycle so the chain ends at a 200 URL.
    autofix: false

  - id: redirect.temporary_should_be_permanent
    title: Permanent moves are marked as temporary
    why: "Google keeps listing the old address and is slower to pass its standing on to the new one."
    plain_fix: "Mark the redirect as permanent, so Google moves the old page's standing to the new one."
    module: A
    severity: warning
    score: search
    rule: A move that is permanent should use 301, not 302.
    source: https://developers.google.com/search/docs/crawling-indexing/301-redirects
    fix: Change the status to 301 so ranking signals consolidate on the destination.
    autofix: true

  - id: link.internal_to_redirect
    title: Your own links point at old addresses that redirect
    why: "Every click takes a detour, which slows visitors down and wastes search engines' time."
    plain_fix: "Update the links to use the page's current address."
    module: A
    severity: warning
    score: search
    rule: Internal links should point at the final URL, not at a redirect.
    source: https://developers.google.com/search/docs/crawling-indexing/301-redirects
    fix: Update the link in the template or content to the destination URL.
    autofix: true

  - id: robots.unreachable
    title: Search engines can't read your robots.txt file
    why: "When Google can't read this file, it may stop visiting your site until it can."
    plain_fix: "Make sure a robots.txt file loads at the root of your site, such as yoursite.com/robots.txt."
    module: A
    severity: error
    score: both
    rule: robots.txt must be fetchable and return 200 or 404, never 5xx.
    source: RFC 9309 section 2.3.1
    fix: Serve robots.txt at the site root. A 5xx can stop crawling of the whole site.
    autofix: false

  - id: robots.invalid_syntax
    title: Your robots.txt file has mistakes in it
    why: "Search engines may ignore the rules you meant to set, or apply them to the wrong pages."
    plain_fix: "Correct the line siteseo points to. Every rule needs to sit under a line naming which crawler it's for."
    module: A
    severity: warning
    score: both
    rule: robots.txt must parse as a valid robots exclusion file.
    source: RFC 9309 section 2.2
    fix: Correct the malformed line. Group every rule under a User-agent line.
    autofix: true

  - id: robots.blocks_css_or_js
    title: Search engines are blocked from your page styles or scripts
    why: "Google can't see your pages the way visitors do, so it may misjudge them, especially on phones."
    plain_fix: "Remove the rule that stops search engines loading your style and script files."
    module: A
    severity: error
    score: both
    rule: robots.txt must not block the CSS or JavaScript a page needs to render.
    source: https://developers.google.com/crawling/docs/robots-txt/robots-txt-spec
    fix: Remove the Disallow rule covering the asset path.
    autofix: true

  - id: robots.no_sitemap_line
    title: Your robots.txt doesn't point to your sitemap
    why: "Search engines have to find your sitemap some other way, so new pages can take longer to be noticed."
    plain_fix: "Add a line to robots.txt giving the full address of your sitemap."
    module: A
    severity: notice
    score: search
    rule: robots.txt should name the XML sitemap.
    source: RFC 9309 section 2.2.3
    fix: Add a Sitemap line with the absolute sitemap URL.
    autofix: true

  - id: index.noindex_in_sitemap
    title: Your sitemap lists pages you've told Google to skip
    why: "You're asking Google to list a page and to skip it at the same time, which wastes its attention."
    plain_fix: "Either take the page out of the sitemap, or remove the setting that hides it from Google."
    module: A
    severity: error
    score: search
    rule: A URL carrying noindex must not appear in the sitemap.
    source: https://developers.google.com/search/docs/crawling-indexing/block-indexing
    fix: Remove the URL from the sitemap, or remove the noindex if the page should be indexed.
    autofix: true

  - id: index.noindex_but_linked
    title: Pages in your menus are hidden from Google
    why: "A page your visitors can reach from the menu will never show up in search results."
    plain_fix: "Decide which you meant: show the page in Google, or take it out of your menus."
    module: A
    severity: warning
    score: search
    rule: A noindex page reached from site navigation is usually a mistake.
    source: https://developers.google.com/search/docs/crawling-indexing/block-indexing
    fix: Decide which is intended. Either drop the noindex or drop the navigation link.
    autofix: false

  - id: canonical.missing
    title: Pages don't say which address is the main one
    why: "Google has to guess which version of a page to list, and it may pick the wrong one."
    plain_fix: "Add a tag to each page naming its own address as the main one. siteseo can add this for you."
    module: A
    severity: warning
    score: search
    rule: Every indexable page should declare a canonical URL.
    source: https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
    fix: Add a self-referencing canonical link to the page template.
    autofix: true

  - id: canonical.not_absolute
    title: Main-address tags are missing the full web address
    why: "Search engines may read the address wrongly and ignore the tag."
    plain_fix: "Write the full web address, starting with https://, in the tag. siteseo can do this for you."
    module: A
    severity: warning
    score: search
    rule: A canonical URL must be absolute, including scheme and host.
    source: https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
    fix: Replace the relative canonical with the full URL.
    autofix: true

  - id: canonical.not_self_referencing
    title: Pages name a different page as their main version
    why: "You're telling Google to list a different page instead of this one, which hides it from search."
    plain_fix: "Point the tag at the page's own address, unless it really is a copy of another page."
    module: A
    severity: warning
    score: search
    rule: A unique page should point its canonical at itself.
    source: https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
    fix: Point the canonical at this URL, or confirm the page is a deliberate duplicate.
    autofix: false

  - id: canonical.target_not_200
    title: Main-address tags point at pages that don't load
    why: "You're pointing Google at a page that doesn't load, so it may list neither."
    plain_fix: "Point the tag at a page that loads."
    module: A
    severity: error
    score: search
    rule: A canonical URL must resolve to a 200 response.
    source: https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
    fix: Point the canonical at a URL that returns 200.
    autofix: false

  - id: canonical.target_noindex
    title: Main-address tags point at pages hidden from Google
    why: "You're pointing Google at a page you've also told it to skip, so it may list neither."
    plain_fix: "Point the tag at a page Google is allowed to list, or stop hiding the page it points to."
    module: A
    severity: error
    score: search
    rule: A canonical must not point at a page carrying noindex.
    source: https://developers.google.com/search/docs/crawling-indexing/block-indexing
    fix: Point the canonical elsewhere, or remove the noindex from the target.
    autofix: false

  - id: canonical.chain
    title: Main-address tags point at a page that points somewhere else
    why: "Google has to follow a trail to find the main page, and it may stop partway."
    plain_fix: "Point every version of the page straight at the same final main page."
    module: A
    severity: warning
    score: search
    rule: A canonical must not point at a page whose own canonical is a third URL.
    source: https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
    fix: Point every page in the group at the same final canonical URL.
    autofix: false

  - id: canonical.conflicts_hreflang
    title: Language versions disagree about which page is the main one
    why: "Google gets mixed signals about which language version to show, and may show visitors the wrong one."
    plain_fix: "Make each language version name itself as its main page, and link the versions to each other."
    module: A
    severity: error
    score: search
    rule: An hreflang target must be the canonical for its own language version.
    source: https://developers.google.com/search/docs/specialty/international/localized-versions
    fix: Make each language version self-canonical and cross-reference with hreflang.
    autofix: false

  - id: sitemap.missing
    title: Your site has no sitemap
    why: "A sitemap is the simplest way to tell search engines every page you have. Without one, some pages may be missed."
    plain_fix: "Create a sitemap, which most website tools can do automatically, and mention it in robots.txt."
    module: A
    severity: warning
    score: search
    rule: The site should publish an XML sitemap.
    source: https://developers.google.com/search/docs/crawling-indexing/sitemaps/build-sitemap
    fix: Generate a sitemap and reference it from robots.txt.
    autofix: true

  - id: sitemap.invalid_xml
    title: Your sitemap file is broken
    why: "Search engines can't read a broken sitemap, so it does nothing for you."
    plain_fix: "Fix the error in the sitemap file. Regenerating it with your website tool usually does it."
    module: A
    severity: error
    score: search
    rule: The sitemap must be well-formed XML matching the sitemap protocol.
    source: https://www.sitemaps.org/protocol.html
    fix: Correct the XML. Escape ampersands and close every element.
    autofix: true

  - id: sitemap.contains_non_200
    title: Your sitemap lists pages that don't load
    why: "Your sitemap sends search engines to pages that don't load, which makes them trust it less."
    plain_fix: "Remove pages that don't load, or that redirect, from the sitemap."
    module: A
    severity: error
    score: search
    rule: A sitemap must list only URLs that return 200.
    source: https://developers.google.com/search/docs/crawling-indexing/sitemaps/build-sitemap
    fix: Remove URLs that redirect or error from the sitemap.
    autofix: true

  - id: sitemap.contains_noncanonical
    title: Your sitemap lists duplicate addresses
    why: "Listing duplicate addresses tells search engines to spend time on pages you don't want shown."
    plain_fix: "List only the main address of each page in the sitemap."
    module: A
    severity: warning
    score: search
    rule: A sitemap should list canonical URLs only.
    source: https://developers.google.com/search/docs/crawling-indexing/sitemaps/build-sitemap
    fix: Replace each entry with the canonical version of that page.
    autofix: true

  - id: sitemap.lastmod_is_build_time
    title: Your sitemap says every page changed when the site was rebuilt
    why: "When every page claims to have just changed, search engines stop believing the dates and can miss real updates."
    plain_fix: "Set each page's date to when its content last really changed."
    module: A
    severity: warning
    score: search
    rule: lastmod should record the last real content change, not the build time.
    source: https://developers.google.com/search/docs/crawling-indexing/sitemaps/build-sitemap
    fix: Take lastmod from the file's last content commit in git.
    autofix: true

  - id: sitemap.too_many_urls
    title: Your sitemap lists more pages than one file may hold
    why: "Search engines stop reading after the limit, so pages past it are ignored."
    plain_fix: "Split the sitemap into several smaller files, with one index file that lists them."
    module: A
    severity: error
    score: search
    rule: A single sitemap file must hold no more than 50,000 URLs.
    source: https://www.sitemaps.org/protocol.html
    fix: Split into several sitemaps and publish a sitemap index.
    autofix: true

  - id: sitemap.too_large
    title: Your sitemap file is too big
    why: "Search engines may refuse a sitemap this big, so none of it helps."
    plain_fix: "Split the sitemap into several smaller files, with one index file that lists them."
    module: A
    severity: error
    score: search
    rule: A single sitemap file must be 50 MB or smaller when uncompressed.
    source: https://www.sitemaps.org/protocol.html
    fix: Split into several sitemaps and publish a sitemap index.
    autofix: true

  - id: structure.orphan_url
    title: Some pages have no links pointing to them
    why: "Pages nobody links to are hard for visitors and search engines to find, and they usually rank poorly."
    plain_fix: "Link to the page from a related page, or remove it from the sitemap if it isn't needed."
    module: A
    severity: warning
    score: search
    rule: A URL in the sitemap should be reachable by an internal link.
    source: https://developers.google.com/crawling/docs/crawl-budget
    fix: Link to the page from a relevant section, or drop it from the sitemap.
    autofix: false

  - id: structure.deep_page
    title: Some pages are buried more than three clicks deep
    why: "Pages many clicks from the homepage get visited less, by people and by search engines."
    plain_fix: "Link to the page from a section or category page closer to your homepage."
    module: A
    severity: notice
    score: search
    rule: Pages should sit within three clicks of the homepage.
    source: https://developers.google.com/crawling/docs/crawl-budget
    fix: Add a link from a hub or category page closer to the root.
    autofix: false

  - id: https.no_redirect_from_http
    title: The insecure version of your site doesn't redirect to the secure one
    why: "Some visitors land on the insecure version, and browsers may warn them away."
    plain_fix: "Turn on the setting at your host that sends every visitor to the secure https version."
    module: A
    severity: error
    score: search
    rule: HTTP URLs must redirect to their HTTPS equivalent.
    source: https://web.dev/articles/why-https-matters
    fix: Add a permanent redirect from http to https at the host.
    autofix: true

  - id: https.mixed_content
    title: Secure pages load some files insecurely
    why: "Browsers may block parts of the page or warn visitors that it isn't fully secure."
    plain_fix: "Change the addresses of those images, scripts or styles to start with https://."
    module: A
    severity: error
    score: search
    rule: An HTTPS page must not load subresources over HTTP.
    source: https://web.dev/articles/why-https-matters
    fix: Change the asset URLs to https, or make them protocol-relative to the site root.
    autofix: true

  - id: https.cert_expiring
    title: Your security certificate expires soon
    why: "When it expires, browsers show visitors a full-page security warning instead of your site."
    plain_fix: "Renew your security certificate now. Many hosts can renew it automatically."
    module: A
    severity: error
    score: both
    rule: The TLS certificate should have more than 21 days left.
    source: https://web.dev/articles/why-https-matters
    fix: Renew the certificate. An expired certificate stops crawlers as well as people.
    autofix: false

  - id: host.multiple_canonical_forms
    title: Your site answers at more than one address
    why: "Search engines may treat each version as a separate site and split your standing between them."
    plain_fix: "Pick one address for your site, with or without www, and send every other version to it."
    module: A
    severity: warning
    score: search
    rule: www and non-www, and trailing-slash variants, must resolve to one form.
    source: https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
    fix: Redirect every variant to the single preferred form.
    autofix: true

  - id: duplicate.identical_content
    title: Some pages are exact copies of each other
    why: "Google picks one copy to show and ignores the others, and it may not pick the one you want."
    plain_fix: "Mark one page as the main version, or change the pages so each says something different."
    module: A
    severity: warning
    score: search
    rule: Two indexable URLs should not serve byte-identical content.
    source: https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
    fix: Canonicalize one to the other, or make the pages genuinely different.
    autofix: false

  - id: duplicate.title
    title: Several pages share the same title
    why: "Visitors can't tell these pages apart in search results, and Google may treat them as duplicates."
    plain_fix: "Give each page its own title that says what that page is about."
    module: A
    severity: warning
    score: search
    rule: Page titles should be unique across the site.
    source: https://developers.google.com/search/docs/appearance/title-link
    fix: Rewrite the duplicate titles so each describes its own page.
    autofix: true

  - id: duplicate.meta_description
    title: Several pages share the same description
    why: "Visitors see the same summary for different pages, which gives them less reason to click."
    plain_fix: "Write a separate summary for each page."
    module: A
    severity: notice
    score: search
    rule: Meta descriptions should be unique across the site.
    source: https://developers.google.com/search/docs/appearance/snippet
    fix: Rewrite the duplicates so each summarises its own page.
    autofix: true

  - id: duplicate.near_duplicate
    title: Some pages are almost the same
    why: "Very similar pages compete with each other in search, and neither does as well as one strong page would."
    plain_fix: "Combine the pages into one, or make each clearly different."
    module: A
    severity: notice
    score: search
    rule: Pages with very similar content are worth a human look.
    source: https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
    fix: Merge the pages, or make each one distinct enough to stand alone.
    autofix: false

  - id: render.content_requires_javascript
    title: Page text only appears after scripts run
    why: "Search engines and AI assistants may see an empty page, because many don't run scripts."
    plain_fix: "Have your website build the page text before it's sent, rather than in the visitor's browser. Your developer will know this as server or build-time rendering."
    module: A
    severity: error
    score: both
    rule: Main content should be present in the first HTML response.
    source: https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics
    fix: Render the main content server-side or at build time. Most AI crawlers never run scripts.
    autofix: false

  - id: url.uppercase
    title: Some page addresses use capital letters
    why: "The same page can end up at two addresses, which splits its standing in search."
    plain_fix: "Use lowercase addresses and send the old ones to the new."
    module: A
    severity: notice
    score: search
    rule: URLs should be lowercase to avoid case-variant duplicates.
    source: https://developers.google.com/search/docs/crawling-indexing/url-structure
    fix: Move to a lowercase URL and redirect the old one.
    autofix: false

  - id: url.spaces
    title: Some page addresses contain spaces
    why: "Addresses with spaces break easily when shared or copied, and look untidy in search results."
    plain_fix: "Use hyphens instead of spaces in the address, and send the old address to the new one."
    module: A
    severity: warning
    score: search
    rule: URLs should use hyphens rather than spaces or encoded spaces.
    source: https://developers.google.com/search/docs/crawling-indexing/url-structure
    fix: Rename to a hyphenated slug and redirect the old URL.
    autofix: false

  - id: url.session_parameter
    title: Some page addresses carry tracking codes
    why: "One page ends up at many addresses, which wastes search engines' time and splits its standing."
    plain_fix: "Remove the tracking code from your own links."
    module: A
    severity: warning
    score: search
    rule: URLs should not carry session identifiers or tracking parameters internally.
    source: https://developers.google.com/search/docs/crawling-indexing/url-structure
    fix: Strip the parameter from internal links and canonicalize to the clean URL.
    autofix: false

  - id: url.excessive_length
    title: Some page addresses are very long
    why: "Long addresses get cut off in search results and are awkward to share."
    plain_fix: "Shorten the address and send the old one to the new."
    module: A
    severity: notice
    score: search
    rule: Very long URLs are harder to share and to crawl predictably.
    source: https://developers.google.com/search/docs/crawling-indexing/url-structure
    fix: Shorten the slug and redirect the old URL.
    autofix: false

  # ---------------------------------------------------------------- module B
  - id: title.missing
    title: Some pages have no title
    why: "The title is the headline people see in search results. Without one, Google invents one for you."
    plain_fix: "Add a title that says what the page is about."
    module: B
    severity: error
    score: search
    rule: Every page needs a title element.
    source: https://developers.google.com/search/docs/appearance/title-link
    fix: Add a title describing what the page is about.
    autofix: true

  - id: title.too_short
    title: Some page titles are very short
    why: "You're leaving space unused in the headline searchers see, space that could tell them why to click."
    plain_fix: "Make the title say more about what the page offers."
    module: B
    severity: notice
    score: search
    rule: Titles below about 30 characters usually waste available space.
    source: https://developers.google.com/search/docs/appearance/title-link
    fix: Expand the title to describe the page more fully.
    autofix: true

  - id: title.too_long
    title: Some page titles get cut off in search results
    why: "The end of the headline is cut off in search results, so searchers may miss the important part."
    plain_fix: "Shorten the title and put the most important words first."
    module: B
    severity: notice
    score: search
    rule: Titles beyond about 60 characters are usually truncated in results.
    source: https://developers.google.com/search/docs/appearance/title-link
    fix: Shorten the title so the distinguishing words come first.
    autofix: true

  - id: meta_description.missing
    title: Some pages have no description for search results
    why: "Google shows its own snippet from the page instead, which may not be the part that makes people click."
    plain_fix: "Write a one or two sentence summary of the page."
    module: B
    severity: warning
    score: search
    rule: Every page should have a meta description.
    source: https://developers.google.com/search/docs/appearance/snippet
    fix: Add a description summarising the page in one or two sentences.
    autofix: true

  - id: meta_description.too_short
    title: Some page descriptions are very short
    why: "A very short summary gives searchers little reason to choose your page."
    plain_fix: "Expand the summary to say what the page covers."
    module: B
    severity: notice
    score: search
    rule: Descriptions below about 70 characters usually waste available space.
    source: https://developers.google.com/search/docs/appearance/snippet
    fix: Expand the description to cover what the page answers.
    autofix: true

  - id: meta_description.too_long
    title: Some page descriptions get cut off in search results
    why: "The summary is cut off in search results, so the end of your message is lost."
    plain_fix: "Shorten the summary so the important part comes first."
    module: B
    severity: notice
    score: search
    rule: Descriptions beyond about 160 characters are usually truncated.
    source: https://developers.google.com/search/docs/appearance/snippet
    fix: Tighten the description so the important part survives truncation.
    autofix: true

  - id: heading.h1_missing
    title: Some pages have no main heading
    why: "The main heading tells visitors and search engines what the page is about at a glance."
    plain_fix: "Add one main heading at the top of the page that names its subject."
    module: B
    severity: warning
    score: search
    rule: Every page should have one h1.
    source: https://developers.google.com/search/docs/appearance/structured-data/article
    fix: Add an h1 naming the page's subject.
    autofix: false

  - id: heading.h1_multiple
    title: Some pages have more than one main heading
    why: "Several main headings make it less clear what the page is mainly about."
    plain_fix: "Keep one main heading and turn the others into subheadings."
    module: B
    severity: notice
    score: search
    rule: A page should have exactly one h1.
    source: https://developers.google.com/search/docs/appearance/structured-data/article
    fix: Demote the extra h1 elements to h2.
    autofix: false

  - id: heading.level_skipped
    title: Some pages skip heading levels
    why: "A broken outline is harder for screen readers to follow and less clear to search engines."
    plain_fix: "Use heading levels in order, so the page outline stays clear."
    module: B
    severity: notice
    score: search
    rule: Heading levels should not skip, for example h2 straight to h4.
    source: https://www.w3.org/WAI/tutorials/page-structure/headings/
    fix: Use the next level down so the outline stays readable.
    autofix: false

  - id: image.alt_missing
    title: Some images have no description for people who can't see them
    why: "People using screen readers miss what the image shows, and image search can't understand it."
    plain_fix: "Add a short description of what each image shows. Purely decorative images can have an empty one."
    module: B
    severity: warning
    score: search
    rule: Content images need alt text.
    source: https://developers.google.com/search/docs/appearance/google-images
    fix: Describe what the image shows. Decorative images take an empty alt attribute.
    autofix: true

  - id: image.dimensions_missing
    title: Some images make the page jump as they load
    why: "The page jumps as images load, which annoys visitors and counts against you in Google's speed measures."
    plain_fix: "Give each image its width and height in the page. siteseo can add these for you."
    module: B
    severity: warning
    score: search
    rule: Images need width and height attributes to reserve their space.
    source: https://web.dev/articles/cls
    fix: Add width and height attributes matching the file's intrinsic size.
    autofix: true

  - id: image.legacy_format
    title: Some photos use an older, heavier file format
    why: "Older formats are larger, so pages load more slowly, especially on phones."
    plain_fix: "Save photos as WebP or AVIF, which are smaller files for the same quality."
    module: B
    severity: notice
    score: search
    rule: Photographs should be served in a modern format such as WebP or AVIF.
    source: https://developers.google.com/search/docs/appearance/google-images
    fix: Convert the image and keep a fallback if old browsers matter.
    autofix: false

  - id: image.no_lazy_loading
    title: Images further down the page load before they're needed
    why: "Visitors download images they may never scroll to, which slows the first view of the page."
    plain_fix: "Set images further down the page to load only when visitors scroll near them, but never the main image at the top."
    module: B
    severity: notice
    score: search
    rule: Images below the fold should load lazily.
    source: https://web.dev/articles/browser-level-image-lazy-loading
    fix: Add loading="lazy" to images that start off-screen. Never to the LCP image.
    autofix: true

  - id: image.oversized
    title: Some images are much bigger than they need to be
    why: "Large images make pages slow to load, especially on phones."
    plain_fix: "Shrink or compress the image to the size it's actually shown at."
    module: B
    severity: warning
    score: search
    rule: A single image over 200 KB is usually larger than it needs to be.
    source: https://developers.google.com/search/docs/appearance/google-images
    fix: Compress or resize the file to the dimensions it is actually displayed at.
    autofix: false

  - id: social.og_missing
    title: Pages look plain when shared on social media
    why: "When someone shares your page, it shows up without a picture or a proper title, so fewer people click."
    plain_fix: "Add sharing tags with a title, description and picture to your page template."
    module: B
    severity: notice
    score: search
    rule: Pages should carry Open Graph title, description and image tags.
    source: https://ogp.me/
    fix: Add the og:title, og:description, og:image and og:url tags to the template.
    autofix: true

  - id: social.twitter_card_missing
    title: Pages look plain when shared on X
    why: "Links shared on X show as plain text instead of a card with a picture."
    plain_fix: "Add the tag that tells X to show a large picture card."
    module: B
    severity: notice
    score: search
    rule: Pages should declare a Twitter card type.
    source: https://ogp.me/
    fix: Add a twitter:card tag, usually summary_large_image.
    autofix: true

  - id: social.og_image_not_200
    title: The share image for some pages doesn't load
    why: "Shared links show a broken or missing picture."
    plain_fix: "Point the sharing picture at an image that loads."
    module: B
    severity: warning
    score: search
    rule: The og:image URL must return 200.
    source: https://ogp.me/
    fix: Point og:image at a real image, absolute and publicly reachable.
    autofix: false

  - id: html.lang_missing
    title: Pages don't say what language they're in
    why: "Screen readers may read the page in the wrong accent, and search engines have to guess the language."
    plain_fix: "Set the page language, such as English, in your site's main template."
    module: B
    severity: warning
    score: search
    rule: The html element needs a lang attribute.
    source: https://www.w3.org/WAI/WCAG22/Understanding/language-of-page.html
    fix: Add lang to the html element in the base template.
    autofix: true

  - id: html.viewport_missing
    title: Some pages aren't set up for phones
    why: "On phones the page shows tiny, zoomed-out text, and Google ranks pages by how they work on phones."
    plain_fix: "Add the standard phone-display tag to your site's main template."
    module: B
    severity: error
    score: search
    rule: Pages need a viewport meta tag to render correctly on phones.
    source: https://developers.google.com/search/docs/crawling-indexing/mobile/mobile-sites-mobile-first-indexing
    fix: Add the standard viewport meta tag to the base template.
    autofix: true

  - id: html.charset_missing
    title: Pages don't declare their text encoding
    why: "Some browsers may show garbled characters, especially for accented letters and symbols."
    plain_fix: "Add the standard text-encoding tag at the top of your site's main template."
    module: B
    severity: warning
    score: search
    rule: Pages must declare a character encoding.
    source: https://html.spec.whatwg.org/multipage/semantics.html#charset
    fix: Add a charset meta tag as the first element in head.
    autofix: true

  - id: anchor.empty
    title: Some links have no text
    why: "Screen reader users hear \"link\" with no idea where it goes, and search engines learn nothing from it."
    plain_fix: "Give each link words that say where it goes."
    module: B
    severity: warning
    score: search
    rule: Links need text, an image with alt text, or an accessible label.
    source: https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-in-context.html
    fix: Give the link text describing its destination.
    autofix: false

  - id: anchor.generic
    title: "Some links just say \"click here\" or \"read more\""
    why: "Link words help visitors and search engines understand where a link goes. \"Click here\" tells them nothing."
    plain_fix: "Replace \"click here\" with words that name where the link goes."
    module: B
    severity: notice
    score: search
    rule: Anchor text such as click here or read more describes nothing.
    source: https://developers.google.com/search/docs/crawling-indexing/links-crawlable
    fix: Replace with text naming the destination.
    autofix: false

  - id: content.thin
    title: Some pages have very little on them
    why: "Pages with very little on them rarely answer what searchers are looking for. Worth checking each one is worth having."
    plain_fix: "Check each page is complete. Some short pages are exactly right as they are."
    module: B
    severity: notice
    score: none
    rule: Very short pages are worth a human look. Word count alone never fails a page.
    source: https://developers.google.com/search/docs/fundamentals/creating-helpful-content
    fix: Decide whether the page is complete. Some short pages are exactly right.
    autofix: false

  - id: link.external_broken
    title: Some links to other websites are dead
    why: "Dead links frustrate visitors and make your site look neglected."
    plain_fix: "Update the link to a working page, or remove it."
    module: B
    severity: warning
    score: search
    rule: Outbound links should not point at dead URLs.
    source: https://developers.google.com/search/docs/crawling-indexing/links-crawlable
    fix: Update or remove the link.
    autofix: false

  # ---------------------------------------------------------------- module C
  - id: schema.none_found
    title: Pages miss out on richer search listings
    why: "These details can earn richer listings, such as star ratings, prices or event dates, which draw more clicks."
    plain_fix: "Add listing details that match what the page is, such as a product, an event or an article."
    module: C
    severity: notice
    score: search
    rule: Pages eligible for a rich result should carry structured data.
    source: https://developers.google.com/search/docs/appearance/structured-data/search-gallery
    fix: Add JSON-LD for the type that matches this page.
    autofix: true

  - id: schema.invalid_json
    title: Some search-listing details are broken
    why: "Search engines ignore details they can't read, so you get none of the benefit."
    plain_fix: "Fix the typing mistake in the listing details. Google's Rich Results Test shows where it is."
    module: C
    severity: error
    score: search
    rule: A JSON-LD block must parse as valid JSON.
    source: https://developers.google.com/search/docs/appearance/structured-data/intro-structured-data
    fix: Correct the syntax error in the script block.
    autofix: false

  - id: schema.missing_required_property
    title: Some search-listing details are missing required parts
    why: "Google won't show the richer listing without these parts."
    plain_fix: "Add the missing detail, using what the page already shows."
    module: C
    severity: error
    score: search
    rule: A structured data type must carry the properties its rich result requires.
    source: https://developers.google.com/search/docs/appearance/structured-data/search-gallery
    fix: Add the missing required property, taking the value from the visible page.
    autofix: true

  - id: schema.missing_recommended_property
    title: Some search-listing details could say more
    why: "Adding these can make your listing fuller and more useful to searchers."
    plain_fix: "Add the detail if the page really includes that information."
    module: C
    severity: notice
    score: search
    rule: Recommended properties improve how a rich result can be shown.
    source: https://developers.google.com/search/docs/appearance/structured-data/search-gallery
    fix: Add the recommended property if the page really carries that fact.
    autofix: true

  - id: schema.unknown_type
    title: Some search-listing details use a type siteseo doesn't check
    why: "siteseo can't confirm these details are right. Google's own testing tool can."
    plain_fix: "Check the details in Google's Rich Results Test."
    module: C
    severity: notice
    score: search
    rule: The declared type is not one siteseo validates.
    source: https://schema.org/docs/full.html
    fix: Confirm the type is right. siteseo checks the types that produce rich results.
    autofix: false

  - id: schema.contradicts_visible_content
    title: Search-listing details don't match what's on the page
    why: "Google can penalise pages whose listing details don't match what visitors actually see."
    plain_fix: "Make the listing details match the page, or show the information on the page."
    module: C
    severity: error
    score: search
    rule: Structured data must describe what is visible on the page.
    source: https://developers.google.com/search/docs/appearance/structured-data/sd-policies
    fix: Correct the markup to match the page, or put the fact on the page.
    autofix: false

  - id: schema.sameas_unresolvable
    title: Profile links in your listing details are broken
    why: "Broken profile links weaken the connection between your site and your other profiles."
    plain_fix: "Fix or remove the broken profile link."
    module: C
    severity: warning
    score: search
    rule: sameAs links must resolve.
    source: https://developers.google.com/search/docs/appearance/structured-data/organization
    fix: Fix or remove the dead profile URL.
    autofix: false

  - id: schema.faq_or_howto_for_rich_results
    title: FAQ and how-to markup no longer earns special listings
    why: "This markup no longer earns special listings for most sites, so it isn't worth adding for that reason."
    plain_fix: "Nothing to change. Keep the markup if it helps in other ways, but don't expect a special listing."
    module: C
    severity: notice
    score: none
    rule: FAQPage and HowTo markup no longer produce rich results for most sites.
    source: https://developers.google.com/search/blog/2023/08/howto-faq-changes
    fix: Keep the markup if it serves another purpose, but do not expect a rich result.
    autofix: false

  - id: schema.rich_result_not_detected
    title: Google doesn't see the richer listing your page asks for
    why: "Your page asks for a richer listing, but Google isn't seeing it, so you aren't getting it."
    plain_fix: "Test the page in Google's Rich Results Test and fix what it reports."
    module: C
    severity: warning
    score: search
    rule: Search Console should detect the rich result type the page marks up.
    source: https://developers.google.com/search/docs/appearance/structured-data/search-gallery
    fix: Check the page in the Rich Results Test and resolve what it reports.
    autofix: false

  # ---------------------------------------------------------------- module D
  - id: cwv.lcp_above_threshold
    title: Pages take too long to show their main content
    why: "Visitors wait too long to see the page, and Google uses this speed measure when ranking."
    plain_fix: "Make the main image or text appear sooner: smaller images, fewer files to wait for, and a faster host."
    module: D
    severity: warning
    score: search
    rule: Largest Contentful Paint should be 2.5 seconds or less at the 75th percentile.
    source: https://web.dev/articles/lcp
    fix: Preload the LCP image, cut render-blocking resources, and improve server response time.
    autofix: false

  - id: cwv.inp_above_threshold
    title: Pages are slow to respond when visitors tap or click
    why: "The page feels sluggish when visitors try to use it, and Google uses this measure when ranking."
    plain_fix: "Reduce the scripts that run when visitors tap or click."
    module: D
    severity: warning
    score: search
    rule: Interaction to Next Paint should be 200 ms or less at the 75th percentile.
    source: https://web.dev/articles/inp
    fix: Break up long tasks and reduce the JavaScript running on interaction.
    autofix: false

  - id: cwv.cls_above_threshold
    title: Pages jump around while loading
    why: "Things move as the page loads, so visitors tap the wrong thing. Google uses this measure when ranking."
    plain_fix: "Reserve space for images, ads and anything that loads late, so the page doesn't shift."
    module: D
    severity: warning
    score: search
    rule: Cumulative Layout Shift should be 0.1 or less at the 75th percentile.
    source: https://web.dev/articles/cls
    fix: Reserve space for images, ads and late-loading elements.
    autofix: false

  - id: perf.no_field_data
    title: Not enough visitors yet for real-world speed data
    why: "Google hasn't collected enough real-visitor data yet, so speed is judged from a lab test instead. This is normal for smaller sites."
    plain_fix: "Nothing to fix. Use the lab results as a guide until you have more visitors."
    module: D
    severity: notice
    score: none
    rule: Small sites often have no CrUX field data. Lab results are used instead.
    source: https://developer.chrome.com/docs/crux
    fix: Nothing to fix. Read the lab numbers as a guide, not as what users experience.
    autofix: false

  - id: perf.crux_unavailable
    title: Google refused the request for real-visitor speed data
    why: "Google refused the request, which is a setup problem, not a sign your site is quiet. The setup guide shows the fix."
    plain_fix: "Turn on the Chrome UX Report API in Google Cloud and allow your key to use it. The PageSpeed page of the setup guide shows how."
    module: D
    severity: warning
    score: none
    rule: >-
      The Chrome UX Report API must accept the PageSpeed key before field data
      can be read. A refusal is a setup problem, not a sign the site is quiet.
    source: https://developer.chrome.com/docs/crux/api
    fix: >-
      Enable the Chrome UX Report API in the key's Cloud project and add it to
      the key's API restrictions. See docs/setup/06-pagespeed.md.
    autofix: false

  - id: perf.ttfb_slow
    title: Your server is slow to start sending pages
    why: "Every page starts late, before anything else can load."
    plain_fix: "Ask your host about caching, or move to faster hosting."
    module: D
    severity: warning
    score: search
    rule: Time to First Byte should stay under 800 ms.
    source: https://web.dev/articles/ttfb
    fix: Cache at the edge, or move the work off the request path.
    autofix: false

  - id: perf.render_blocking
    title: Some files hold up the first view of the page
    why: "Visitors stare at a blank screen while these files download."
    plain_fix: "Load only what the first screen needs straight away, and the rest afterwards."
    module: D
    severity: warning
    score: search
    rule: Stylesheets and scripts in head delay first paint.
    source: https://developer.chrome.com/docs/lighthouse/performance/render-blocking-resources
    fix: Inline what the first screen needs and defer the rest.
    autofix: false

  - id: perf.text_uncompressed
    title: Pages are sent without compression
    why: "Pages take longer to download than they need to, especially on slower connections."
    plain_fix: "Turn on compression at your host. It's usually a single setting."
    module: D
    severity: warning
    score: search
    rule: HTML, CSS and JavaScript should be served compressed.
    source: https://developer.chrome.com/docs/lighthouse/performance/uses-text-compression
    fix: Turn on gzip or brotli at the host or CDN.
    autofix: false

  - id: perf.static_no_cache_header
    title: Browsers re-download files they already have
    why: "Returning visitors download the same files again, so every visit is slower than it needs to be."
    plain_fix: "Tell browsers to keep files that rarely change. Your host usually has a setting for this."
    module: D
    severity: notice
    score: search
    rule: Fingerprinted static assets should carry a long cache lifetime.
    source: https://developer.chrome.com/docs/lighthouse/performance/uses-long-cache-ttl
    fix: Set a long max-age with immutable on hashed asset paths.
    autofix: false

  - id: perf.page_weight
    title: Some pages are heavy for phones
    why: "Heavy pages are slow on phones and use up visitors' data."
    plain_fix: "Compress images, remove scripts you don't use, and trim your fonts."
    module: D
    severity: notice
    score: search
    rule: A page over 2 MB is heavy for a phone on a slow connection.
    source: https://developer.chrome.com/docs/lighthouse/performance/total-byte-weight
    fix: Compress images, drop unused JavaScript, and subset fonts.
    autofix: false

  # ---------------------------------------------------------------- module E
  - id: ai.blocked_against_policy
    title: AI assistants you allow are being turned away
    why: "You've said this AI assistant may read your site, but it's being turned away, so it can't recommend you."
    plain_fix: "Remove the rule in robots.txt, or at your host or firewall, that blocks this AI assistant. siteseo can fix the robots.txt part for you."
    module: E
    severity: error
    score: ai
    rule: A crawler your policy allows must not be blocked by robots.txt or the host.
    source: https://developers.google.com/search/docs/fundamentals/ai-optimization-guide
    fix: Remove the Disallow rule, or the CDN rule, that blocks this crawler.
    autofix: true

  - id: ai.allowed_against_policy
    title: AI crawlers you meant to block can still get in
    why: "You've said this AI crawler should be blocked, but it can still read your site."
    plain_fix: "Add a rule to robots.txt that blocks this crawler. siteseo can do this for you."
    module: E
    severity: error
    score: ai
    rule: A crawler your policy blocks must actually be blocked.
    source: https://developers.openai.com/api/docs/bots
    fix: Add the Disallow rule for this user agent to robots.txt.
    autofix: true

  - id: ai.fetch_non_200
    title: AI assistants get an error when they visit
    why: "The assistant gets an error instead of your page, so it can't use or cite it."
    plain_fix: "Check your host's or firewall's bot settings for a rule that turns this assistant away."
    module: E
    severity: error
    score: ai
    rule: An allowed crawler's user agent should receive a 200 response.
    source: https://developers.openai.com/api/docs/bots
    fix: Check CDN bot rules and any WAF rule matching this user agent.
    autofix: false

  - id: ai.robots_live_differs_from_repo
    title: The robots.txt on your live site isn't the one you wrote
    why: "Something between you and visitors, often your host or CDN, is changing your rules without your knowledge."
    plain_fix: "Look for a robots.txt or bot-management setting at your host or CDN that rewrites the file."
    module: E
    severity: error
    score: ai
    rule: The robots.txt served live must match the one in the repo.
    source: RFC 9309 section 2.3
    fix: A CDN is rewriting robots.txt. Check managed robots and bot settings at the host.
    autofix: false

  - id: ai.content_requires_javascript
    title: AI assistants see empty pages because the text needs scripts
    why: "AI assistants don't run scripts, so they see an empty page and can't use or cite it."
    plain_fix: "Have your website build the page text before it's sent, rather than in the visitor's browser."
    module: E
    severity: error
    score: ai
    rule: AI crawlers read the first HTML response and do not run JavaScript.
    source: https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics
    fix: Render main content server-side or at build time.
    autofix: false

  - id: ai.indexnow_key_missing
    title: Bing isn't told the moment your pages change
    why: "With IndexNow, Bing and others hear about your changes the moment you publish instead of whenever they next visit."
    plain_fix: "Turn on IndexNow. siteseo can set it up and notify search engines each time you publish."
    module: E
    severity: notice
    score: search
    rule: IndexNow lets you tell Bing and others about changed URLs immediately.
    source: https://www.indexnow.org/documentation
    fix: Publish a key file at the site root and ping IndexNow on deploy.
    autofix: true

  - id: ai.llms_txt_absent
    title: No llms.txt file (for information only)
    why: "Reported for information only. Google says it doesn't use this file, and it doesn't change either score."
    plain_fix: "Nothing to do."
    module: E
    severity: notice
    score: none
    rule: llms.txt is reported for information only and affects neither score.
    source: https://ahrefs.com/blog/llmstxt-study/
    fix: Nothing to do. No search or AI system is documented to use it.
    autofix: false

  - id: ai.llms_txt_present
    title: An llms.txt file is present (for information only)
    why: "Reported for information only. Google says it doesn't use this file, and it doesn't change either score."
    plain_fix: "Nothing to do."
    module: E
    severity: notice
    score: none
    rule: llms.txt is reported for information only and affects neither score.
    source: https://ahrefs.com/blog/llmstxt-study/
    fix: Nothing to do. Keeping it costs nothing and changes nothing.
    autofix: false

  # ---------------------------------------------------------------- module F
  - id: content.answer_not_near_top
    title: Some pages bury the answer people came for
    why: "Searchers and AI assistants both favour pages that answer the question straight away."
    plain_fix: "Put the direct answer near the top of the page, in plain sentences."
    module: F
    severity: warning
    score: search
    rule: A page should answer its own title and top queries near the top, plainly.
    source: https://developers.google.com/search/docs/fundamentals/creating-helpful-content
    fix: Move the direct answer above the fold and state it in plain sentences.
    autofix: false

  - id: content.not_original
    title: Some pages say nothing a competitor's page doesn't
    why: "Search engines and AI assistants favour pages that offer something others don't."
    plain_fix: "Add what only you can offer: your own experience, data, photos or examples."
    module: F
    severity: warning
    score: search
    rule: Content should carry something only this site can offer.
    source: https://developers.google.com/search/docs/fundamentals/creating-helpful-content
    fix: Add first-hand testing, own data, own photographs, or specific examples.
    autofix: false

  - id: content.author_missing
    title: Articles don't say who wrote them
    why: "Readers and search engines trust content more when they can see who wrote it."
    plain_fix: "Add the author's name to each article, linked to a page about them."
    module: F
    severity: warning
    score: search
    rule: Articles should name a visible author.
    source: https://developers.google.com/search/docs/appearance/structured-data/article
    fix: Add a byline linking to an author page.
    autofix: false

  - id: content.contact_missing
    title: Visitors can't easily find who you are or how to reach you
    why: "Visitors trust a business they can identify and reach, and so does Google."
    plain_fix: "Add an About page and a way to contact you, linked from every page."
    module: F
    severity: warning
    score: search
    rule: A site should carry an about page and reachable contact details.
    source: https://developers.google.com/search/docs/fundamentals/creating-helpful-content
    fix: Add an about page and a contact route, linked from every page.
    autofix: false

  - id: content.updated_date_mismatch
    title: "An \"updated\" date doesn't match a real change"
    why: "An \"updated\" date with no real change can mislead readers, and Google says not to do it."
    plain_fix: "Show the date of the last real change, or remove the date."
    module: F
    severity: warning
    score: search
    rule: A displayed update date must match a real content change in git history.
    source: https://developers.google.com/search/docs/appearance/publication-dates
    fix: Show the date of the last real edit, or remove the date.
    autofix: false

  - id: content.cannibalization
    title: Two of your pages compete for the same search
    why: "Your two pages split the clicks, and neither ranks as well as one stronger page would."
    plain_fix: "Combine the two pages, or make them clearly different and link one to the other."
    module: F
    severity: warning
    score: search
    rule: Two pages splitting impressions for one query compete with each other.
    source: https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls
    fix: Merge the pages, or differentiate them and link one to the other.
    autofix: false

  - id: content.decay
    title: A page is losing search clicks
    why: "This page is getting fewer clicks from search than it used to. Refreshing it often wins them back."
    plain_fix: "Bring the page up to date, and check whether people now search for this differently."
    module: F
    severity: warning
    score: search
    rule: Clicks down 30 percent or more across 28 days signals a page losing ground.
    source: https://support.google.com/webmasters/answer/7576553
    fix: Refresh the content, or check whether the query itself changed shape.
    autofix: false

  - id: content.ctr_outlier
    title: A page ranks well but few people click it
    why: "People see this page in results but rarely click. A better title or description could change that."
    plain_fix: "Rewrite the title and summary to match what people are searching for."
    module: F
    severity: notice
    score: search
    rule: A page ranking well with click-through well under the site median is a rewrite candidate.
    source: https://developers.google.com/search/docs/appearance/title-link
    fix: Rewrite the title and description to match what the query actually asks.
    autofix: true

  - id: content.striking_distance
    title: A search where you're close to page one
    why: "You're already close to page one for this search, so a small improvement could bring real traffic."
    plain_fix: "Strengthen the part of the page that answers this search."
    module: F
    severity: notice
    score: none
    rule: Queries at positions 8 to 20 with steady impressions are the cheapest wins.
    source: https://support.google.com/webmasters/answer/7576553
    fix: Strengthen the section of the page that addresses this query.
    autofix: false

  # ---------------------------------------------------------------- module G
  - id: links.no_inbound
    title: Some pages have no links from the rest of your site
    why: "Pages your site never links to are hard for visitors and search engines to find."
    plain_fix: "Link to the page from related pages on your site."
    module: G
    severity: warning
    score: search
    rule: Every page should have at least one internal link pointing at it.
    source: https://developers.google.com/search/docs/crawling-indexing/links-crawlable
    fix: Link to the page from related content or a hub page.
    autofix: false

  - id: links.single_inbound
    title: Some pages have only one link pointing to them
    why: "One link gives this page little standing. A few more from related pages would help."
    plain_fix: "Add links to it from a few other related pages."
    module: G
    severity: notice
    score: search
    rule: A page with one inbound link is barely connected to the site.
    source: https://developers.google.com/search/docs/crawling-indexing/links-crawlable
    fix: Add links from other relevant pages.
    autofix: false

  - id: links.anchor_monotony
    title: Every link to a page uses the same words
    why: "Varying the link words helps search engines understand everything the page covers."
    plain_fix: "Vary the words you use when linking to this page."
    module: G
    severity: notice
    score: search
    rule: Every inbound link using identical anchor text wastes the signal.
    source: https://developers.google.com/search/docs/crawling-indexing/links-crawlable
    fix: Vary the anchor text to describe different aspects of the target.
    autofix: false

  - id: links.high_value_page_deep
    title: A page that earns traffic is hard to reach from the homepage
    why: "A page that already earns visitors deserves to be easy to reach from your homepage."
    plain_fix: "Link to this page from your homepage or a main menu page."
    module: G
    severity: warning
    score: search
    rule: A page earning impressions should sit within two clicks of the homepage.
    source: https://developers.google.com/crawling/docs/crawl-budget
    fix: Link it from the homepage or a top-level hub.
    autofix: false

  - id: links.suggestion
    title: A link worth adding between related pages
    why: "Linking related pages helps visitors keep reading and helps search engines see how your topics connect."
    plain_fix: "Add the suggested link if it would help a reader."
    module: G
    severity: notice
    score: none
    rule: A specific internal link worth adding, based on topic overlap.
    source: https://developers.google.com/search/docs/crawling-indexing/links-crawlable
    fix: Add the suggested link if the connection makes sense to a reader.
    autofix: false

  # ---------------------------------------------------------------- module H
  - id: hreflang.not_reciprocal
    title: Language versions don't point back to each other
    why: "Google ignores language links that only go one way, so visitors may get the wrong language."
    plain_fix: "Make each language version link back to the others."
    module: H
    severity: error
    score: search
    rule: Every hreflang reference must be returned by the page it points at.
    source: https://developers.google.com/search/docs/specialty/international/localized-versions
    fix: Add the return reference to the target page's hreflang set.
    autofix: true

  - id: hreflang.invalid_code
    title: Some language tags use invalid codes
    why: "Google ignores codes it doesn't recognise, so visitors may get the wrong language version."
    plain_fix: "Use standard codes, such as en for English or en-GB for English in the UK."
    module: H
    severity: error
    score: search
    rule: hreflang values must be valid language, or language-region, codes.
    source: https://developers.google.com/search/docs/specialty/international/localized-versions
    fix: Use an ISO 639-1 language code, optionally with an ISO 3166-1 alpha-2 region.
    autofix: true

  - id: hreflang.no_x_default
    title: No default page for visitors in other languages
    why: "Visitors whose language you don't cover may land on an unexpected version."
    plain_fix: "Choose a default page for visitors whose language you don't offer."
    module: H
    severity: notice
    score: search
    rule: An hreflang set should name a default for unmatched users.
    source: https://developers.google.com/search/docs/specialty/international/localized-versions
    fix: Add an x-default entry pointing at the fallback page.
    autofix: true

  - id: hreflang.target_not_200
    title: Some language versions don't load
    why: "Visitors are sent to language versions that don't load."
    plain_fix: "Point the language link at a page that loads, or remove it."
    module: H
    severity: error
    score: search
    rule: Every hreflang target must return 200.
    source: https://developers.google.com/search/docs/specialty/international/localized-versions
    fix: Point the entry at a live URL or remove it.
    autofix: false

  - id: hreflang.target_not_canonical
    title: Language tags point at duplicate addresses
    why: "Mixed signals mean Google may show the wrong version to the wrong country."
    plain_fix: "Point each language link at the main address of that version."
    module: H
    severity: warning
    score: search
    rule: An hreflang target should be the canonical URL for its language version.
    source: https://developers.google.com/search/docs/specialty/international/localized-versions
    fix: Point hreflang at the canonical URL of each version.
    autofix: false

  # ---------------------------------------------------------------- module I
  - id: local.nap_mismatch
    title: Your business name, address or phone differ between pages
    why: "Different details make customers and Google unsure which are right, which can hurt your local listing."
    plain_fix: "Keep your business name, address and phone in one place and use it everywhere."
    module: I
    severity: error
    score: search
    rule: Name, address and phone must match across pages and structured data.
    source: https://developers.google.com/search/docs/appearance/structured-data/local-business
    fix: Make one source of truth and render it everywhere.
    autofix: false

  - id: local.localbusiness_incomplete
    title: Your local business details are incomplete
    why: "Complete details help Google show your hours, address and phone right in search results."
    plain_fix: "Add the missing address, phone or opening hours to your business details."
    module: I
    severity: warning
    score: search
    rule: LocalBusiness markup should carry address, phone and opening hours.
    source: https://developers.google.com/search/docs/appearance/structured-data/local-business
    fix: Add the missing properties from the details shown on the page.
    autofix: true

  - id: local.manual_checklist
    title: Local listing tasks to do by hand
    why: "Some local listings, such as your Google Business Profile, can only be updated by hand."
    plain_fix: "Check your Google Business Profile and Bing Places listings yourself."
    module: I
    severity: notice
    score: none
    rule: Some local work has no API and has to be done by hand.
    source: https://support.google.com/business/answer/3038177
    fix: Check the Google Business Profile and Bing Places listings yourself.
    autofix: false

  # ---------------------------------------------------------------- module J
  - id: gsc.not_configured
    title: Google Search Console isn't connected yet
    why: "Without Search Console, siteseo can't see which searches bring you visitors or rank fixes by traffic."
    plain_fix: "Connect Google Search Console. The setup guide walks you through it."
    module: J
    severity: notice
    score: none
    rule: Search Console data needs a service account before it can be pulled.
    source: https://developers.google.com/webmaster-tools/v1/api_reference_index
    fix: Create a service account, grant it access to the property, and store the path in your vault.
    autofix: false

  - id: gsc.sitemap_error
    title: Google reports errors in your sitemap
    why: "Google is telling you it couldn't fully read your sitemap, so some pages may be missed."
    plain_fix: "Fix what Search Console reports, then resubmit the sitemap."
    module: J
    severity: error
    score: search
    rule: Search Console should report no errors for a submitted sitemap.
    source: https://support.google.com/webmasters/answer/7451001
    fix: Resolve what Search Console reports, then resubmit.
    autofix: false

  - id: gsc.url_not_indexed
    title: Some pages aren't in Google yet
    why: "These pages can't bring you any search visitors until Google adds them to its index."
    plain_fix: "Check the page in Search Console, fix the reason it gives, and ask Google to index it."
    module: J
    severity: warning
    score: search
    rule: A sitemap URL earning no impressions may not be indexed at all.
    source: https://support.google.com/webmasters/answer/9012289
    fix: Inspect the URL, resolve the reason given, and request indexing.
    autofix: false

  - id: bing.not_configured
    title: Bing Webmaster Tools isn't connected yet
    why: "Without Bing data, siteseo can't see your Bing searches or when Microsoft Copilot cites you."
    plain_fix: "Connect Bing Webmaster Tools. The setup guide walks you through it."
    module: J
    severity: notice
    score: none
    rule: Bing Webmaster data needs an API key before it can be pulled.
    source: https://learn.microsoft.com/en-us/bingwebmaster/getting-access
    fix: Generate an API key in Bing Webmaster Tools and store it in your vault.
    autofix: false

  # ---------------------------------------------------------------- module K
  - id: ai_vis.not_cited
    title: AI assistants didn't mention you for this question
    why: "When customers ask this question, the assistant recommends other sites instead of yours."
    plain_fix: "Judge this over several runs, not one. Make sure your page answers the question directly."
    module: K
    severity: notice
    score: none
    rule: The site was not cited for this prompt in this run.
    source: https://developers.google.com/search/docs/fundamentals/ai-optimization-guide
    fix: Read citation rates as trends across several runs, never as a single verdict.
    autofix: false

  - id: ai_vis.citation_rate_dropped
    title: AI assistants mention you less often than last time
    why: "Assistants are naming you less often for this question than they did last time."
    plain_fix: "Check that the page that used to be mentioned still answers the question directly."
    module: K
    severity: warning
    score: none
    rule: Citation rate for a prompt fell against the previous run.
    source: https://developers.google.com/search/docs/fundamentals/ai-optimization-guide
    fix: Check whether the page that used to be cited still answers the prompt directly.
    autofix: false

  - id: ai_vis.bot_blocked_in_logs
    title: AI crawlers are being refused in your server logs
    why: "Your server is turning this AI crawler away in practice, even though your rules allow it."
    plain_fix: "Check your host's or firewall's bot settings and rate limits."
    module: K
    severity: error
    score: ai
    rule: An allowed AI crawler repeatedly receiving 403 or 429 is being refused in practice.
    source: https://developers.openai.com/api/docs/bots
    fix: Check CDN bot rules and rate limits. User-agent rules alone do not explain this.
    autofix: false

  - id: ai_vis.no_referrals
    title: No visitors arrived from AI assistants
    why: "No visitors arrived from AI assistants this period. That is common, because assistants often answer without sending a click."
    plain_fix: "Nothing to fix directly. Keep an eye on it alongside how often assistants mention you."
    module: K
    severity: notice
    score: none
    rule: No referral traffic arrived from AI assistants in this period.
    source: https://developers.google.com/search/docs/fundamentals/ai-optimization-guide
    fix: Nothing to fix directly. Compare against citation rate and bot access.
    autofix: false

  # ---------------------------------------------------------------- module L
  - id: research.budget_exceeded
    title: This research would go over your monthly limit
    why: "siteseo stops before spending past the monthly limit you set."
    plain_fix: "Raise the monthly limit in siteseo.yaml, or wait for next month."
    module: L
    severity: error
    score: none
    rule: A paid request would take the month past the configured cap.
    source: https://dataforseo.com/pricing
    fix: Raise budget.monthly_usd in siteseo.yaml, or wait for the next month.
    autofix: false

  # ---------------------------------------------------------------- module M
  - id: backlinks.lost_referring_domains
    title: Some websites that linked to you no longer do
    why: "Links from other websites help you rank. Losing them can lower your standing."
    plain_fix: "Check whether the pages that linked to you still exist."
    module: M
    severity: notice
    score: none
    rule: Referring domains present in the previous import are gone from this one.
    source: https://support.google.com/webmasters/answer/9049606
    fix: Check whether the linking pages still exist. No toxicity scoring is performed.
    autofix: false

  - id: backlinks.no_data
    title: No backlink data imported yet
    why: "Without link data, siteseo can't tell you which websites point to yours."
    plain_fix: "Export the links report from Search Console and add it to your site's .siteseo/imports folder."
    module: M
    severity: notice
    score: none
    rule: No backlink data has been imported for this site yet.
    source: https://support.google.com/webmasters/answer/9049606
    fix: Export the Search Console links report to .siteseo/imports/ and run the module again.
    autofix: false

  # ---------------------------------------------------------------- module O
  # Agent readiness. Every check here is score: none. Module O reports a level
  # on Cloudflare's published 0 to 5 ladder in its own section and never moves
  # search health or AI access. Nothing here is an error, so nothing here blocks
  # a deploy: absence of an optional standard is a notice, and a published
  # document that is wrong is a warning. None of it affects Google Search, which
  # its AI optimization guide says ignores Markdown, AI text files and markup.
  - id: agent.robots_txt_missing
    title: Your site has no robots.txt file
    why: "This is the first file search engines and AI crawlers look for. Without it you have no say in what they do."
    plain_fix: "Add a robots.txt file to your site. siteseo can write one from your settings."
    module: O
    severity: notice
    score: none
    rule: Agents and crawlers look for robots.txt first. Without it there is nowhere to state a preference.
    source: https://www.rfc-editor.org/rfc/rfc9309.html
    fix: Publish robots.txt at the site root with a User-agent group and a Sitemap line.
    autofix: true

  - id: agent.link_headers_missing
    title: Your homepage doesn't point agents to its machine-readable files
    why: "These headers point AI agents to your machine-readable files so they don't have to guess."
    plain_fix: "Ask your developer to add a Link header on the homepage pointing to your machine-readable files."
    module: O
    severity: notice
    score: none
    rule: A homepage Link header lets an agent find machine-readable resources without guessing paths.
    source: https://www.rfc-editor.org/rfc/rfc9727.html
    fix: Send a Link header on the homepage pointing at your API catalog or other agent documents, from the host's headers file or an edge rule.
    autofix: false

  - id: agent.ai_rules_obsolete_token
    title: Your robots.txt names AI crawlers that no longer exist
    why: "Rules for names that no longer exist do nothing, so the crawler you meant to control isn't controlled."
    plain_fix: "Add rules for the crawler names the AI companies use today."
    module: O
    severity: notice
    score: none
    rule: robots.txt groups should name crawler tokens their operators still document.
    source: https://support.claude.com/en/articles/8896518-does-anthropic-crawl-data-from-the-web-and-how-can-site-owners-block-the-crawler
    fix: Add the current tokens next to the old group. anthropic-ai and Claude-Web are no longer on Anthropic's list; ClaudeBot, Claude-SearchBot and Claude-User are.
    autofix: false

  - id: agent.content_signals_missing
    title: Your site doesn't say how AI may use your content
    why: "This line tells AI companies whether they may use your content for search, answers or training."
    plain_fix: "Add a Content-Signal line to robots.txt. siteseo can write it from your settings."
    module: O
    severity: notice
    score: none
    rule: A Content-Signal line in robots.txt states whether content may be used for search, AI input and AI training.
    source: https://contentsignals.org/
    fix: Add a Content-Signal line to the User-agent * group. siteseo derives the values from ai_policy.
    autofix: true

  - id: agent.content_signals_invalid
    title: Your AI-use settings are written incorrectly
    why: "Wrongly written settings may be ignored, so your choice about AI use isn't heard."
    plain_fix: "Correct the Content-Signal line. siteseo can rewrite it for you."
    module: O
    severity: warning
    score: none
    rule: Content-Signal values must be search, ai-input or ai-train, each set to yes or no.
    source: https://contentsignals.org/
    fix: Correct the line. Unknown categories and values other than yes or no are ignored by anything reading it.
    autofix: true

  - id: agent.content_signals_contradict_policy
    title: Your AI-use settings contradict your stated policy
    why: "Your site is telling AI companies something different from what you decided."
    plain_fix: "Let siteseo rewrite the line from your settings, or change your settings if the line is right."
    module: O
    severity: warning
    score: none
    rule: Content Signals must say the same thing as the ai_policy declared in siteseo.yaml.
    source: https://contentsignals.org/
    fix: Regenerate the Content-Signal line from ai_policy, or change ai_policy if the signal is what you meant.
    autofix: true

  - id: agent.markdown_negotiation_missing
    title: AI agents can't ask for a plain-text copy of your pages
    why: "AI agents read plain text more easily and cheaply than full web pages, so offering it helps them use your content."
    plain_fix: "Run /siteseo markdown after each build. It creates a plain-text copy of every page for free, on any host."
    module: O
    severity: notice
    score: none
    rule: A request sending Accept text/markdown can be answered with Markdown while browsers keep getting HTML.
    source: https://developers.cloudflare.com/fundamentals/reference/markdown-for-agents/
    fix: Run /siteseo markdown after each build to write a .md file next to every page, then /siteseo markdown --setup for the rule that serves it on your host. Free on any host. On Cloudflare Pro and above, Markdown for Agents converts at the edge instead.
    autofix: false

  - id: agent.markdown_missing_vary
    title: A cache could show browsers the plain-text copy of a page
    why: "Without this, a cache could show the plain-text copy to ordinary visitors."
    plain_fix: "Ask your developer to add Accept to the Vary header on these pages."
    module: O
    severity: warning
    score: none
    rule: A URL that returns HTML or Markdown depending on Accept must send Vary Accept, or a cache can hand Markdown to a browser.
    source: https://www.rfc-editor.org/rfc/rfc9110.html
    fix: Add Accept to the Vary header on every negotiated response.
    autofix: false

  - id: agent.api_catalog_missing
    title: Your public API isn't listed where agents look
    why: "Agents look here to discover your API. Without it they may not find it."
    plain_fix: "If you have a public API, list it at /.well-known/api-catalog."
    module: O
    severity: notice
    score: none
    rule: A site with a public API should list it at /.well-known/api-catalog.
    source: https://www.rfc-editor.org/rfc/rfc9727.html
    fix: Publish a linkset at /.well-known/api-catalog with service-desc and service-doc links for each API.
    autofix: false

  - id: agent.api_catalog_invalid
    title: Your API catalog file is broken
    why: "Agents can't read a broken catalog, so they won't find your API through it."
    plain_fix: "Fix the API catalog file so agents can read it."
    module: O
    severity: warning
    score: none
    rule: The API catalog must be JSON with a non-empty linkset array, served as application/linkset+json.
    source: https://www.rfc-editor.org/rfc/rfc9727.html
    fix: Correct the document so each linkset entry has an anchor and at least one link relation.
    autofix: false

  - id: agent.mcp_card_missing
    title: Your MCP server isn't announced where agents look
    why: "AI agents look for this card to find and connect to your MCP server."
    plain_fix: "If you run an MCP server, publish its card so agents can find it."
    module: O
    severity: notice
    score: none
    rule: A site running an MCP server should publish a server card agents can find.
    source: https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2127
    fix: Publish the card at /.well-known/mcp/server-card.json, which scanners read today, and list it in /.well-known/ard.json.
    autofix: false

  - id: agent.mcp_card_invalid
    title: Your MCP server card is broken
    why: "Agents can't use a card that's missing its name and version."
    plain_fix: "Add the missing name and version to your MCP server card."
    module: O
    severity: warning
    score: none
    rule: An MCP server card must be JSON carrying at least a name and a version.
    source: https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2127
    fix: Correct the card. Current drafts want name, version, description and remotes with a transport URL.
    autofix: false

  - id: agent.mcp_card_legacy_shape
    title: Your MCP server card uses an outdated format
    why: "Newer agents expect the current format and may not read this one."
    plain_fix: "Nothing is broken today. Update the format when the new standard is final."
    module: O
    severity: notice
    score: none
    rule: The serverInfo shape from SEP-1649 was superseded by SEP-2127, which moves name and version to the top level.
    source: https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2127
    fix: Nothing is broken today. When SEP-2127 merges, move name and version to the top level and add remotes.
    autofix: false

  - id: agent.a2a_card_missing
    title: Your AI agent isn't announced where other agents look
    why: "Other AI agents look for this card to find and talk to yours."
    plain_fix: "If you run an AI agent, publish its card so other agents can find it."
    module: O
    severity: notice
    score: none
    rule: A site running an A2A agent should publish its Agent Card at /.well-known/agent-card.json.
    source: https://a2a-protocol.org/latest/specification/
    fix: Publish the card with name, description, version, supportedInterfaces, capabilities, input and output modes, and skills.
    autofix: false

  - id: agent.a2a_card_invalid
    title: Your agent card is missing required details
    why: "Agents can't use a card that's missing required details."
    plain_fix: "Add the missing details listed in the finding."
    module: O
    severity: warning
    score: none
    rule: An A2A Agent Card must carry the fields A2A 1.0 marks required.
    source: https://a2a-protocol.org/latest/specification/
    fix: Add the missing required fields named in the evidence.
    autofix: false

  - id: agent.a2a_card_legacy_shape
    title: Your agent card uses an outdated format
    why: "Agents built for the current standard may not read the old format."
    plain_fix: "Update the card to the current format."
    module: O
    severity: notice
    score: none
    rule: A2A 1.0 removed the top-level url and preferredTransport fields in favour of supportedInterfaces.
    source: https://a2a-protocol.org/latest/specification/
    fix: Move the endpoint into supportedInterfaces with url, protocolBinding and protocolVersion.
    autofix: false

  - id: agent.skills_index_missing
    title: Your agent skills aren't listed where agents look
    why: "Agents look here to discover the skills your site offers."
    plain_fix: "If you offer agent skills, publish a list of them."
    module: O
    severity: notice
    score: none
    rule: A site offering agent skills should list them at /.well-known/agent-skills/index.json.
    source: https://github.com/cloudflare/agent-skills-discovery-rfc
    fix: Publish the index with the 0.2.0 $schema and one entry per skill.
    autofix: false

  - id: agent.skills_index_invalid
    title: Your skills list is missing required details
    why: "Agents can't use entries that are missing required details."
    plain_fix: "Fix the entries listed in the finding."
    module: O
    severity: warning
    score: none
    rule: Each skills index entry needs name, type, description, url and a sha256 digest in the documented formats.
    source: https://github.com/cloudflare/agent-skills-discovery-rfc
    fix: Correct the entries named in the evidence.
    autofix: false

  - id: agent.skills_digest_mismatch
    title: A skill file doesn't match its published fingerprint
    why: "Agents check this fingerprint before trusting a skill, so a mismatch means they'll refuse or distrust it."
    plain_fix: "Regenerate the skill fingerprints each time you publish."
    module: O
    severity: warning
    score: none
    rule: A skill's published digest must match the file it points at, or agents will reject or distrust it.
    source: https://github.com/cloudflare/agent-skills-discovery-rfc
    fix: Regenerate the digests in the index from the files as deployed, as part of the build.
    autofix: false

  - id: agent.web_bot_auth_invalid
    title: Your bot identity keys are published incorrectly
    why: "Sites can't verify your bot's identity, so its requests may be treated as untrusted."
    plain_fix: "Fix the key file. Only sites that run their own bot need it."
    module: O
    severity: warning
    score: none
    rule: A Web Bot Auth key directory must be a JWKS with at least one key.
    source: https://datatracker.ietf.org/doc/draft-ietf-webbotauth-httpsig-protocol/
    fix: Serve a keys array of public JWKs. Only sites that operate their own bot need this file at all.
    autofix: false

  - id: agent.oauth_discovery_missing
    title: Agents can't discover how to sign in to your API
    why: "Agents need this to sign in to your API without someone setting it up by hand."
    plain_fix: "Ask your developer to publish your sign-in details for agents."
    module: O
    severity: notice
    score: none
    rule: An API that agents authenticate to should publish OAuth or OpenID Connect discovery metadata.
    source: https://www.rfc-editor.org/rfc/rfc8414.html
    fix: Serve /.well-known/oauth-authorization-server or /.well-known/openid-configuration from the authorization server.
    autofix: false

  - id: agent.oauth_discovery_invalid
    title: Your sign-in details for agents are broken
    why: "Agents can't sign in using broken details."
    plain_fix: "Add the missing sign-in details listed in the finding."
    module: O
    severity: warning
    score: none
    rule: Authorization server metadata must be JSON with an issuer and the endpoints its grants use.
    source: https://www.rfc-editor.org/rfc/rfc8414.html
    fix: Add the fields named in the evidence. The issuer must be an https URL.
    autofix: false

  - id: agent.protected_resource_missing
    title: Your API doesn't say which sign-in services it trusts
    why: "Agents won't know where to get permission to use your API."
    plain_fix: "Ask your developer to publish which sign-in services your API trusts."
    module: O
    severity: notice
    score: none
    rule: A protected API should say which authorization servers it trusts at /.well-known/oauth-protected-resource.
    source: https://www.rfc-editor.org/rfc/rfc9728.html
    fix: Publish resource and authorization_servers, and point to it from WWW-Authenticate on 401 responses.
    autofix: false

  - id: agent.protected_resource_invalid
    title: Your API's sign-in details are broken
    why: "Agents can't read broken details, so they won't know how to get permission."
    plain_fix: "Add the missing details listed in the finding."
    module: O
    severity: warning
    score: none
    rule: Protected resource metadata must be JSON with a resource identifier.
    source: https://www.rfc-editor.org/rfc/rfc9728.html
    fix: Add the resource field, and authorization_servers so agents know where to get a token.
    autofix: false

  - id: agent.auth_md_missing
    title: No auth.md page explains how agents can register
    why: "This page tells AI agents how to sign up for your service."
    plain_fix: "If agents can sign up for your service, publish an auth.md page explaining how."
    module: O
    severity: notice
    score: none
    rule: A service that lets agents register can describe how at /auth.md.
    source: https://github.com/workos/auth.md
    fix: Publish /auth.md with an H1 containing auth.md, and an agent_auth block in authorization server metadata.
    autofix: false

  - id: agent.auth_md_invalid
    title: Your auth.md page is in the wrong format
    why: "Agents may not recognise the page in this format."
    plain_fix: "Serve auth.md as a plain Markdown file with the expected heading."
    module: O
    severity: warning
    score: none
    rule: /auth.md must be Markdown whose H1 contains auth.md.
    source: https://github.com/workos/auth.md
    fix: Serve the Markdown file itself, not an HTML page, with the expected heading.
    autofix: false

  - id: agent.auth_md_stale_fields
    title: Your auth.md uses outdated field names
    why: "Agents built for the current version may not understand the old field names."
    plain_fix: "Update the field names to the current version."
    module: O
    severity: notice
    score: none
    rule: auth.md 0.6.0 renamed register_uri and claim_uri and replaced verified_email with service_auth.
    source: https://github.com/workos/auth.md
    fix: Move to identity_endpoint, claim_endpoint and service_auth as described in the current README.
    autofix: false

  - id: agent.webmcp_not_detected
    title: Browser agents can't use your site's actions as tools
    why: "This lets AI agents in the browser use your site's features directly, such as booking or searching."
    plain_fix: "If your site has actions such as booking or searching, ask your developer about WebMCP."
    module: O
    severity: notice
    score: none
    rule: A site with actions an agent could take in the browser can expose them as WebMCP tools.
    source: https://webmachinelearning.github.io/webmcp/
    fix: Register tools with document.modelContext.registerTool, or mark forms with toolname and tooldescription.
    autofix: false

  - id: agent.webmcp_legacy_api
    title: Your browser tools use an outdated WebMCP setup
    why: "Browsers now use the newer setup, so the old one may stop working."
    plain_fix: "Ask your developer to switch to the current WebMCP setup."
    module: O
    severity: notice
    score: none
    rule: WebMCP moved from navigator.modelContext to document.modelContext in May 2026.
    source: https://webmachinelearning.github.io/webmcp/
    fix: Call document.modelContext, falling back to navigator.modelContext only for older preview builds.
    autofix: false

  - id: agent.dns_aid_missing
    title: Agents can't find your agent services through DNS
    why: "This lets agents find your agent services from your domain name alone."
    plain_fix: "Optional. Ask whoever manages your domain's DNS about publishing an agent record."
    module: O
    severity: notice
    score: none
    rule: DNS-AID lets agents find a domain's agent endpoints with an SVCB lookup under _agents.
    source: https://datatracker.ietf.org/doc/draft-mozleywilliams-dnsop-dnsaid/
    fix: Publish an SVCB record at _index._agents on this hostname and sign the zone with DNSSEC. The draft is individual and may change.
    autofix: false

  - id: agent.ard_invalid
    title: Your agent resource list is broken
    why: "Agents can't read a broken list, so they won't find your resources through it."
    plain_fix: "Fix the entries listed in the finding."
    module: O
    severity: warning
    score: none
    rule: An agentic resource discovery manifest must be JSON with a non-empty entries array.
    source: https://agenticresourcediscovery.org/spec/
    fix: Give each entry an identifier, a media type, and exactly one of url or data.
    autofix: false

  - id: agent.ard_legacy_location
    title: Your agent resource list is at an old address
    why: "Agents now look at the new address and may not check the old one."
    plain_fix: "Publish the list at its new address. Keeping the old one too does no harm."
    module: O
    severity: notice
    score: none
    rule: ARD renamed /.well-known/ai-catalog.json to /.well-known/ard.json.
    source: https://agenticresourcediscovery.org/spec/
    fix: Serve the manifest at ard.json. Keeping the old path as well costs nothing.
    autofix: false

  - id: agent.commerce_acp_absent
    title: No Agentic Commerce Protocol support announced
    why: "This lets AI shopping agents discover that they can buy from you. Only relevant if you sell to them."
    plain_fix: "Nothing to do unless you want AI agents to buy from you."
    module: O
    severity: notice
    score: none
    rule: A merchant supporting the Agentic Commerce Protocol announces it at /.well-known/acp.json.
    source: https://github.com/agentic-commerce-protocol/agentic-commerce-protocol
    fix: Informational. Publish the discovery document only if you implement ACP checkout.
    autofix: false

  - id: agent.commerce_acp_invalid
    title: Your Agentic Commerce Protocol file is missing details
    why: "Agents can't use an incomplete file, so they can't buy from you through it."
    plain_fix: "Add the missing details listed in the finding."
    module: O
    severity: warning
    score: none
    rule: The ACP discovery document needs protocol name and version, api_base_url, transports and services.
    source: https://github.com/agentic-commerce-protocol/agentic-commerce-protocol
    fix: Add the fields named in the evidence.
    autofix: false

  - id: agent.commerce_ucp_absent
    title: No Universal Commerce Protocol profile
    why: "This lets AI shopping agents discover how to buy from you. Only relevant if you sell to them."
    plain_fix: "Nothing to do unless you want AI agents to buy from you."
    module: O
    severity: notice
    score: none
    rule: A merchant supporting the Universal Commerce Protocol publishes a profile at /.well-known/ucp.
    source: https://ucp.dev/latest/specification/overview/
    fix: Informational. Publish the profile only if you implement UCP.
    autofix: false

  - id: agent.commerce_ucp_invalid
    title: Your Universal Commerce Protocol profile is missing details
    why: "Agents can't use an incomplete profile to buy from you."
    plain_fix: "Add the missing details listed in the finding."
    module: O
    severity: warning
    score: none
    rule: A UCP profile needs a ucp object carrying version, services and payment_handlers.
    source: https://ucp.dev/latest/specification/overview/
    fix: Add the fields named in the evidence. Empty services and payment_handlers objects are valid.
    autofix: false

  - id: agent.commerce_mpp_absent
    title: No Machine Payments Protocol offers
    why: "This lets AI agents pay for your services automatically. Only relevant if you sell to them."
    plain_fix: "Nothing to do unless you want AI agents to pay you."
    module: O
    severity: notice
    score: none
    rule: The Machine Payments Protocol advertises payable operations through x-payment-info in /openapi.json.
    source: https://mpp.dev/advanced/discovery
    fix: Informational. Add x-payment-info only to operations that actually charge.
    autofix: false

  - id: agent.commerce_mpp_invalid
    title: Your Machine Payments Protocol offers are missing details
    why: "Agents can't pay using incomplete offers."
    plain_fix: "Add the missing details listed in the finding."
    module: O
    severity: warning
    score: none
    rule: Each x-payment-info offer needs intent, method and amount.
    source: https://mpp.dev/advanced/discovery
    fix: Add the fields named in the evidence.
    autofix: false

  - id: agent.commerce_x402_absent
    title: No x402 payment support
    why: "This lets AI agents pay per request for your content or API. Only relevant if you charge them."
    plain_fix: "Nothing to do unless you want AI agents to pay per request."
    module: O
    severity: notice
    score: none
    rule: x402 answers an unpaid request with 402 and machine-readable payment requirements.
    source: https://github.com/x402-foundation/x402
    fix: Informational. Add x402 middleware to the routes you want agents to pay for.
    autofix: false

  - id: agent.commerce_x402_invalid
    title: Your x402 payment response doesn't say how to pay
    why: "Agents don't know how to pay, so they can't complete the request."
    plain_fix: "Say how to pay in the response, or stop asking for payment on that page."
    module: O
    severity: warning
    score: none
    rule: A 402 response must say how to pay, in a PAYMENT-REQUIRED header or an x402 JSON body.
    source: https://github.com/x402-foundation/x402
    fix: Return the payment requirements with the 402, or stop returning 402 on that route.
    autofix: false

  - id: agent.commerce_ap2_absent
    title: No Agent Payments Protocol support
    why: "This lets AI agents make payments to your agent. Only relevant if you sell to them."
    plain_fix: "Nothing to do unless you want AI agents to make payments to you."
    module: O
    severity: notice
    score: none
    rule: Agent Payments Protocol support is declared as an extension on the site's A2A Agent Card.
    source: https://github.com/google-agentic-commerce/AP2
    fix: Informational. Add the AP2 extension with your role to capabilities.extensions on the Agent Card.
    autofix: false

# The ladder, as published in the scanner's scan-site SKILL.md.
levels:
  - {level: 0, name: Not Ready}
  - {level: 1, name: Basic Web Presence}
  - {level: 2, name: Bot-Aware}
  - {level: 3, name: Agent-Readable}
  - {level: 4, name: Agent-Integrated}
  - {level: 5, name: Agent-Native}

standards:
  - {scanner: discoverability.robotsTxt, check: robots_txt, name: robots.txt, profile: content, origin: open-standard, spec: "https://www.rfc-editor.org/rfc/rfc9309.html"}
  - {scanner: discoverability.sitemap, check: sitemap, name: XML sitemap, profile: content, origin: open-standard, spec: "https://www.sitemaps.org/protocol.html"}
  - {scanner: discoverability.linkHeaders, check: link_headers, name: Link response headers, profile: content, origin: open-standard, spec: "https://www.rfc-editor.org/rfc/rfc8288.html"}
  - {scanner: discoverability.dnsAid, check: dns_aid, name: DNS for AI Discovery, profile: api, origin: community, spec: "https://datatracker.ietf.org/doc/draft-mozleywilliams-dnsop-dnsaid/"}
  - {scanner: contentAccessibility.markdownNegotiation, check: markdown_negotiation, name: Markdown content negotiation, profile: content, origin: cloudflare-led, spec: "https://developers.cloudflare.com/fundamentals/reference/markdown-for-agents/"}
  - {scanner: botAccessControl.robotsTxtAiRules, check: ai_rules, name: AI crawler rules, profile: content, origin: open-standard, spec: "https://www.rfc-editor.org/rfc/rfc9309.html"}
  - {scanner: botAccessControl.contentSignals, check: content_signals, name: Content Signals, profile: content, origin: cloudflare-led, spec: "https://contentsignals.org/"}
  - {scanner: botAccessControl.webBotAuth, check: web_bot_auth, name: Web Bot Auth, profile: api, origin: cloudflare-led, spec: "https://datatracker.ietf.org/doc/draft-ietf-webbotauth-httpsig-protocol/"}
  - {scanner: discovery.apiCatalog, check: api_catalog, name: API catalog, profile: api, origin: open-standard, spec: "https://www.rfc-editor.org/rfc/rfc9727.html"}
  - {scanner: discovery.oauthDiscovery, check: oauth_discovery, name: OAuth and OIDC discovery, profile: api, origin: open-standard, spec: "https://www.rfc-editor.org/rfc/rfc8414.html"}
  - {scanner: discovery.oauthProtectedResource, check: protected_resource, name: OAuth protected resource metadata, profile: api, origin: open-standard, spec: "https://www.rfc-editor.org/rfc/rfc9728.html"}
  - {scanner: discovery.authMd, check: auth_md, name: auth.md, profile: api, origin: vendor, spec: "https://github.com/workos/auth.md"}
  - {scanner: discovery.mcpServerCard, check: mcp_card, name: MCP server card, profile: api, origin: community, spec: "https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2127"}

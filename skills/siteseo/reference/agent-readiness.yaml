  - {scanner: discovery.agentSkills, check: agent_skills, name: Agent skills index, profile: api, origin: cloudflare-led, spec: "https://github.com/cloudflare/agent-skills-discovery-rfc"}
  - {scanner: discovery.webMcp, check: webmcp, name: WebMCP, profile: api, origin: community, spec: "https://webmachinelearning.github.io/webmcp/"}
  - {scanner: discovery.ard, check: ard, name: Agentic resource discovery, profile: api, origin: community, spec: "https://agenticresourcediscovery.org/spec/"}
  - {scanner: commerce.acp, check: acp, name: Agentic Commerce Protocol, profile: commerce, origin: vendor, spec: "https://github.com/agentic-commerce-protocol/agentic-commerce-protocol"}
  - {scanner: commerce.ap2, check: ap2, name: Agent Payments Protocol, profile: commerce, origin: vendor, spec: "https://github.com/google-agentic-commerce/AP2"}

# Agent readiness data for module O.
#
# Two jobs. `standards` maps each check Cloudflare's scanner runs to the siteseo
# check that covers it, the profile it belongs to, and where the standard comes
# from, so `--compare-cloudflare` can line the two answers up. `scanner.skills`
# pins the digest of every skill the scanner publishes, so sync_upstream can
# report the day Cloudflare adds, removes or rewrites a check.
#
# origin values:
#   open-standard   an IETF RFC or long-established protocol any host implements
#   cloudflare-led  a draft or spec Cloudflare wrote or leads, still open to anyone
#   vendor          a spec owned by one company or consortium
#   community       a proposal with no standards body behind it
#
# profile values say which siteseo.yaml profile reports it as missing:
#   content < api < commerce
last_verified: 2026-09-15


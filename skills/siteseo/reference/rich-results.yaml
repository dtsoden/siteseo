# Required and recommended properties per structured data type.
#
# Scope is deliberately the types that produce a rich result in Google Search,
# taken from the Search Gallery. Types outside this list are reported as
# unknown rather than guessed at.
#
# FAQPage and HowTo are present but carry `rich_result: false`. Google narrowed
# FAQ rich results to a small set of sites and dropped HowTo rich results in
# 2023, so siteseo never recommends adding them and never treats their absence
# as a problem. Pages that already have them get a notice saying so.
last_verified: 2026-09-11

types:
  Organization:
    docs: https://developers.google.com/search/docs/appearance/structured-data/organization
    required: [name, url]
    recommended: [logo, sameAs, description, address, contactPoint]

  WebSite:
    docs: https://developers.google.com/search/docs/appearance/site-names
    required: [name, url]
    recommended: [alternateName, potentialAction]

  Person:
    docs: https://developers.google.com/search/docs/appearance/structured-data/profile-page
    required: [name]
    recommended: [url, sameAs, jobTitle, image]

  Article:
    docs: https://developers.google.com/search/docs/appearance/structured-data/article
    required: [headline]
    recommended: [image, datePublished, dateModified, author, publisher, description]

  BlogPosting:
    docs: https://developers.google.com/search/docs/appearance/structured-data/article
    required: [headline]
    recommended: [image, datePublished, dateModified, author, publisher, description]

  NewsArticle:
    docs: https://developers.google.com/search/docs/appearance/structured-data/article
    required: [headline]
    recommended: [image, datePublished, dateModified, author, publisher]

  BreadcrumbList:
    docs: https://developers.google.com/search/docs/appearance/structured-data/breadcrumb
    required: [itemListElement]
    recommended: []

  Product:
    docs: https://developers.google.com/search/docs/appearance/structured-data/product
    required: [name]
    recommended: [image, description, sku, brand, offers, aggregateRating, review]

  LocalBusiness:
    docs: https://developers.google.com/search/docs/appearance/structured-data/local-business
    required: [name, address]
    recommended: [telephone, openingHoursSpecification, geo, url, priceRange, image]

  SoftwareApplication:
    docs: https://developers.google.com/search/docs/appearance/structured-data/software-app
    required: [name, offers, aggregateRating]
    recommended: [applicationCategory, operatingSystem, description, screenshot]

  Event:
    docs: https://developers.google.com/search/docs/appearance/structured-data/event
    required: [name, startDate, location]
    recommended: [description, endDate, image, offers, performer, organizer]

  Recipe:
    docs: https://developers.google.com/search/docs/appearance/structured-data/recipe
    required: [name, image]
    recommended: [recipeIngredient, recipeInstructions, author, datePublished,
                  cookTime, prepTime, nutrition, aggregateRating]

  VideoObject:
    docs: https://developers.google.com/search/docs/appearance/structured-data/video
    required: [name, description, thumbnailUrl, uploadDate]
    recommended: [duration, contentUrl, embedUrl, expires]

  FAQPage:
    docs: https://developers.google.com/search/blog/2023/08/howto-faq-changes
    rich_result: false
    required: [mainEntity]
    recommended: []
    note: >
      Google limited FAQ rich results to a narrow set of sites. siteseo never
      recommends adding this markup and never treats its absence as a problem.

  HowTo:
    docs: https://developers.google.com/search/blog/2023/08/howto-faq-changes
    rich_result: false
    required: [name, step]
    recommended: []
    note: >
      Google dropped HowTo rich results in 2023. siteseo never recommends adding
      this markup and never treats its absence as a problem.

# Google's structured data policies target markup that fabricates facts the
# reader cannot see. That is a narrow set, and being narrow is the point: a
# description in markup is a summary and is expected to paraphrase the page,
# so demanding a verbatim substring match on it reports correct sites as
# violations.
#
# Only the values below are checked against the rendered page, because
# inventing them is the abuse the policy is actually written about: prices that
# are not offered, ratings and review counts with nothing behind them.
must_match_visible:
  - price
  - ratingValue
  - reviewCount

# Structural types that only ever appear nested inside another type. They are
# never reported as unvalidated, because a ListItem inside a BreadcrumbList is
# correct markup, not an unknown type.
structural_types:
  - ListItem
  - Thing
  - PostalAddress
  - ImageObject
  - Offer
  - AggregateRating
  - Rating
  - Review
  - ContactPoint
  - GeoCoordinates
  - OpeningHoursSpecification
  - Brand
  - MonetaryAmount
  - QuantitativeValue
  - Duration
  - Place
  - CreativeWork
  - WebPage
  - ItemList
  - SearchAction
  - EntryPoint

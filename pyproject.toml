[project]
name = "siteseo"
version = "0.1.0"
description = "Search and AI search readiness auditing for sites you own."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Soden" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
